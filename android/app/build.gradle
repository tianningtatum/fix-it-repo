plugins {
    id 'com.android.application'
}

def buildNumber = (System.getenv("VERSION_CODE") ?: "1").toInteger()

android {
    namespace 'io.github.fixitcrew'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.fixitcrew"
        minSdk 26
        targetSdk 34
        versionCode buildNumber
        versionName "1.0." + buildNumber
    }

    signingConfigs {
        // A fixed key so every new build installs over the old one.
        release {
            storeFile file("fixitcrew.keystore")
            storePassword "fixitcrew"
            keyAlias "fixitcrew"
            keyPassword "fixitcrew"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
